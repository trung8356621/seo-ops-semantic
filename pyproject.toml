[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-ops-semantic"
version = "0.1.0"
description = "Standalone semantic analytics infrastructure (embedding + pgvector)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "psycopg[binary]==3.2.6",
  "fastembed==0.6.1",
  "numpy==2.2.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[project.scripts]
semantic-doctor = "app.diagnostics.doctor:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires PostgreSQL + pgvector",
]
